// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    // The id 'com.android.application' is for the app module. The version is specified here.
    // 'apply false' means it's available for subprojects but not applied to this root project.
    id 'com.android.application' version '8.2.0' apply false
}

// Optional: Define a task that deletes the root project's build directory.
// This is a standard convenience task for a clean build.
tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
