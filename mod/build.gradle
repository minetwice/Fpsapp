plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.6.3'
    id 'java-library'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    // Fabric Loader (mod implementation ke liye)
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    
    // Agar Fabric API chahiye (optional), to uncomment karo:
    // modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

loom {
    // Required for remap plugin
    mods {
        vulkanmod {
            sourceSet sourceSets.main
        }
    }
    mixin.defaultRefmapName = "vulkanmod.refmap.json"
}

processResources {
    // Native .so file ko JAR ke andar lib/arm64-v8a/ mein copy karo
    from("$rootDir/native/build/libvulkan_renderer.so") {
        into "lib/arm64-v8a/"
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}
