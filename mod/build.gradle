plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.15.4'
    id 'java-library'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

loom {
    mixin.useLegacyMixinAp = false
}

// Ensure native library is built before we try to copy it
task buildNative(type: Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', '-c', '''
        cd native
        cmake -B build -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=RelWithDebInfo
        cmake --build build
    '''
}

// Copy the .so to a temporary directory that will be included in the JAR
task prepareNativeLib(type: Copy) {
    dependsOn buildNative
    from("$rootDir/native/build/libvulkan_renderer.so")
    into "$buildDir/tmp/native/lib/arm64-v8a/"
}

// Include the native library directly in the JAR
jar {
    dependsOn prepareNativeLib
    from("$buildDir/tmp/native") {
        into "/"
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    dependsOn prepareNativeLib
    from("$buildDir/tmp/native") {
        into "/"
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 21
}
