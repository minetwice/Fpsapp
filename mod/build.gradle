plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.15.4'
    id 'java-library'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

loom {
    mixin.useLegacyMixinAp = false
}

// Copy native library to the correct resources folder before building JAR
task copyNativeLib(type: Copy) {
    from("$rootDir/native/build/libvulkan_renderer.so")
    into "src/main/resources/lib/arm64-v8a/"
}

processResources {
    dependsOn copyNativeLib
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 21
}
