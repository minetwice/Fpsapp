plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.15.4'
    id 'java-library'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

loom {
    mixin.useLegacyMixinAp = false
}

// 1. Build native library using CMake
task buildNative(type: Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', '-c', '''
        cd native
        cmake -B build -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=RelWithDebInfo
        cmake --build build
    '''
}

// 2. Copy the .so to the resources directory (where Loom will package it)
task copyNativeToResources(type: Copy) {
    dependsOn buildNative
    from("$rootDir/native/build/libvulkan_renderer.so")
    into "$projectDir/src/main/resources/lib/arm64-v8a/"
}

// 3. Ensure resources are processed after copying
processResources {
    dependsOn copyNativeToResources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// 4. Clean up the copied .so after build (optional)
task cleanNativeFromResources(type: Delete) {
    delete "$projectDir/src/main/resources/lib"
}
clean.dependsOn cleanNativeFromResources

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 21
}
