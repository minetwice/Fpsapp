plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14'
    id 'java-library'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    // For obfuscated versions, using 'modCompileOnly' is often sufficient
    modCompileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
}

loom {
    // This block is required for the -remap plugin
    mods {
        vulkanmod {
            sourceSet sourceSets.main
        }
    }
    mixin.defaultRefmapName = "vulkanmod.refmap.json"
}

processResources {
    // This uses the copy closure to avoid empty directories
    from("$rootDir/native/build/libvulkan_renderer.so") {
        into "lib/arm64-v8a/"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}
