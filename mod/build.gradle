plugins {
    id 'fabric-loom' version '1.12'
    id 'java-library'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

loom {
    mixin.defaultRefmapName = "vulkanmod.refmap.json"
    // HACK: Force mod to use only one source set to avoid side split errors
    // This is needed because our Mod doesn't have client-separate sources
    runConfigs.client.ideConfigGenerated = true
}

processResources {
    // Copy The Native Shared Library
    from("$rootDir/app/src/main/jniLibs/arm64-v8a/libvulkan_renderer.so") {
        into "lib/arm64-v8a/"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}
