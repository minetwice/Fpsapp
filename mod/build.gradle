plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.15.4'
    id 'java-library'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

loom {
    mixin.useLegacyMixinAp = false
    // Remove or comment the access widener line:
    // accessWidenerPath = file("src/main/resources/vulkanmod.accesswidener")
}

processResources {
    from(file("$rootDir/native/build/libvulkan_renderer.so")) {
        into "lib/arm64-v8a/"
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 21
}
