plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.15.4'
    id 'java-library'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

loom {
    mixin.useLegacyMixinAp = false
}

// Force include native library after JAR is built
tasks.jar {
    doLast {
        def nativeFile = file("$rootDir/native/build/libvulkan_renderer.so")
        if (nativeFile.exists()) {
            println "Injecting ${nativeFile} into JAR"
            ant.zip(update: true, destfile: archiveFile.get().asFile, fileencoding: 'UTF-8') {
                fileset(file: nativeFile) {
                    include(name: "lib/arm64-v8a/libvulkan_renderer.so")
                }
            }
        } else {
            println "ERROR: Native library not found at ${nativeFile}"
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 21
}
