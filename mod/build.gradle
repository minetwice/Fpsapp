plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.15.4'
    id 'java-library'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' } // LWJGL snapshots
}

dependencies {
    // ... existing dependencies ...
    implementation 'org.lwjgl:lwjgl:3.3.3'
    implementation 'org.lwjgl:lwjgl-vulkan:3.3.3'
    runtimeOnly 'org.lwjgl:lwjgl-platform:3.3.3:natives-linux'
}

loom {
    mixin.useLegacyMixinAp = false
}

// This copies the .so from native/build into the JAR's resources
processResources {
    from("$rootDir/native/build/libvulkan_renderer.so") {
        into "lib/arm64-v8a/"
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 21
}
