plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.15.4'
    id 'java-library'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    
    // LWJGL Vulkan bindings
    implementation 'org.lwjgl:lwjgl:3.3.3'
    implementation 'org.lwjgl:lwjgl-vulkan:3.3.3'
    runtimeOnly 'org.lwjgl:lwjgl-platform:3.3.3:natives-linux'
}

loom {
    mixin.useLegacyMixinAp = false
}

processResources {
    from("$rootDir/native/build/libvulkan_renderer.so") {
        into "lib/arm64-v8a/"
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 21
}
