android {
    compileSdk 34

    defaultConfig {
        minSdk 29  // Android 10, good Vulkan support
        targetSdk 34
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    // 🟢 Tell Gradle where our CMakeLists.txt is for the native code
    externalNativeBuild {
        cmake {
            path "../native/CMakeLists.txt"  // Absolute path to CMake file
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}
