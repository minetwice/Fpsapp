name: Build Fear Launcher with Error Highlighting

on:
  push:
    branches: [ main ]
  pull_request:
    workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.22.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean and build (capture full log)
        id: build
        run: |
          ./gradlew clean :app:assembleDebug --stacktrace 2>&1 | tee build.log
          echo "status=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Extract error lines
        if: steps.build.outputs.status != 0
        id: errors
        run: |
          echo "### ❌ Build Failed - Error Summary" > error_summary.md
          echo "" >> error_summary.md
          echo "```" >> error_summary.md
          grep -E "FAILURE|error|Exception|FAILED|What went wrong|Caused by|> Task" build.log | head -100 >> error_summary.md
          echo "```" >> error_summary.md
          echo "" >> error_summary.md
          echo "### 📄 Full Log (first 200 lines)" >> error_summary.md
          echo "<details><summary>Click to expand</summary>" >> error_summary.md
          echo "" >> error_summary.md
          echo "```" >> error_summary.md
          head -200 build.log >> error_summary.md
          echo "```" >> error_summary.md
          echo "</details>" >> error_summary.md

      - name: Upload error summary as artifact
        if: steps.build.outputs.status != 0
        uses: actions/upload-artifact@v4
        with:
          name: build-error-report
          path: error_summary.md

      - name: Fail the job if build failed
        if: steps.build.outputs.status != 0
        run: exit 1
