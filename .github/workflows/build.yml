name: Build Launcher APK with Native Libraries

on:
  push:
    branches: [ main ]
  pull_request:
    workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.22.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. Build native Vulkan renderer for all ABIs (if native folder exists)
      - name: Build native libraries for multiple ABIs
        run: |
          # ABIs to support – add "x86_64" if needed
          ABIS=("armeabi-v7a" "arm64-v8a" "x86")

          # Create jniLibs directory if not exists
          mkdir -p app/src/main/jniLibs

          for ABI in "${ABIS[@]}"; do
            echo "========================================="
            echo "Building for ABI: $ABI"
            echo "========================================="

            # Clean and create build directory for this ABI
            rm -rf native/build/$ABI
            mkdir -p native/build/$ABI
            cd native/build/$ABI

            # Run CMake
            cmake ../.. \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-29 \
              -DCMAKE_BUILD_TYPE=Release

            # Build
            cmake --build . -j$(nproc)

            # Copy .so to proper jniLibs folder
            mkdir -p ../../../app/src/main/jniLibs/$ABI
            if [ -f libvulkan_renderer.so ]; then
              cp libvulkan_renderer.so ../../../app/src/main/jniLibs/$ABI/
              echo "✅ Copied libvulkan_renderer.so for $ABI"
            else
              echo "⚠️ libvulkan_renderer.so not found for $ABI – skipping"
            fi

            cd ../../..
          done

          # Verify copied libraries
          echo "========================================="
          echo "jniLibs structure:"
          ls -la app/src/main/jniLibs/
          for ABI in "${ABIS[@]}"; do
            echo "--- $ABI ---"
            ls -la app/src/main/jniLibs/$ABI/ || echo "Empty"
          done

      # 2. If boardwalk.jar is present in libs/, copy to app/libs/
      - name: Copy boardwalk.jar if exists
        run: |
          if [ -f libs/boardwalk.jar ]; then
            mkdir -p app/libs
            cp libs/boardwalk.jar app/libs/
            echo "✅ boardwalk.jar copied to app/libs/"
          else
            echo "⚠️ boardwalk.jar not found – make sure to add it or use JitPack dependency"
          fi

      # 3. Build the APK using Gradle
      - name: Build APK
        run: ./gradlew :app:assembleDebug

      # 4. Verify APK size and contents (optional)
      - name: Verify APK
        run: |
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "Generated APK: $APK_PATH"
          ls -lh $APK_PATH
          # Check if native libraries are inside the APK (quick check)
          unzip -l $APK_PATH | grep "lib/" || echo "⚠️ No native libraries found in APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: app/build/outputs/apk/debug/*.apk
