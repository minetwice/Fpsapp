name: Build Launcher APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.22.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ------------------------------------------------------------
      # Build native Vulkan renderer for multiple ABIs
      # ------------------------------------------------------------
      - name: Build native libraries for ABIs
        run: |
          ABIS=("armeabi-v7a" "arm64-v8a" "x86")
          mkdir -p app/src/main/jniLibs

          for ABI in "${ABIS[@]}"; do
            echo "========================================="
            echo "Building for ABI: $ABI"
            echo "========================================="
            rm -rf native/build/$ABI
            mkdir -p native/build/$ABI
            cd native/build/$ABI
            cmake ../.. \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-29 \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build . -j$(nproc)
            mkdir -p ../../../app/src/main/jniLibs/$ABI
            if [ -f libvulkan_renderer.so ]; then
              cp libvulkan_renderer.so ../../../app/src/main/jniLibs/$ABI/
              echo "✅ Copied libvulkan_renderer.so for $ABI"
            else
              echo "⚠️ libvulkan_renderer.so not found for $ABI – skipping"
            fi
            cd ../../..
          done

          echo "Final jniLibs structure:"
          ls -la app/src/main/jniLibs/
          for ABI in "${ABIS[@]}"; do
            echo "--- $ABI ---"
            ls -la app/src/main/jniLibs/$ABI/ || echo "Empty"
          done

      # ------------------------------------------------------------
      # Download boardwalk.jar (if not already in repo)
      # ------------------------------------------------------------
      - name: Download boardwalk.jar if not present
        run: |
          mkdir -p app/libs
          if [ ! -f app/libs/boardwalk.jar ]; then
            echo "📥 boardwalk.jar not found. Downloading from PojavLauncher nightly..."
            curl -L -o app/libs/boardwalk.jar https://nightly.link/PojavLauncherTeam/PojavLauncher/workflows/build/main/boardwalk.jar
            if [ ! -s app/libs/boardwalk.jar ]; then
              echo "⚠️ Nightly download failed. Trying fallback from latest release..."
              DOWNLOAD_URL=$(curl -s https://api.github.com/repos/PojavLauncherTeam/PojavLauncher/releases/latest | grep "browser_download_url.*boardwalk.*\.jar" | cut -d '"' -f 4)
              if [ -n "$DOWNLOAD_URL" ]; then
                curl -L -o app/libs/boardwalk.jar "$DOWNLOAD_URL"
              else
                echo "❌ Could not download boardwalk.jar. You may need to place it manually in app/libs/"
                exit 1
              fi
            fi
          else
            echo "✅ boardwalk.jar already present in app/libs/"
          fi
          ls -la app/libs/

      # ------------------------------------------------------------
      # Build APK (clean and assemble)
      # ------------------------------------------------------------
      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # ------------------------------------------------------------
      # Verify APK contains native libraries and boardwalk.jar
      # ------------------------------------------------------------
      - name: Verify APK contents
        run: |
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "Generated APK: $APK_PATH"
          ls -lh $APK_PATH
          echo "=== Native libraries inside APK ==="
          unzip -l $APK_PATH | grep "lib/" || echo "⚠️ No native libraries found"
          echo "=== Boardwalk JAR inside APK ==="
          unzip -l $APK_PATH | grep "boardwalk.jar" || echo "⚠️ boardwalk.jar not found in APK"

      # ------------------------------------------------------------
      # Upload APK artifact
      # ------------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: app/build/outputs/apk/debug/*.apk
