name: Build Fear Launcher APK

on:
  push:
    branches: [ main ]
  pull_request:
    workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.22.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean Gradle caches and refresh dependencies
        run: ./gradlew clean --refresh-dependencies

      - name: Download boardwalk.jar
        run: |
          mkdir -p app/libs
          if [ ! -f app/libs/boardwalk.jar ]; then
            curl -L -o app/libs/boardwalk.jar https://nightly.link/PojavLauncherTeam/PojavLauncher/workflows/build/main/boardwalk.jar
          fi
          ls -la app/libs/

      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fear-launcher-apk
          path: app/build/outputs/apk/debug/*.apk
