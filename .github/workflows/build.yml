name: Build APK and Mod JAR

on:
  push:
    branches: [ main ]
  pull_request:
    workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.22.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build native Vulkan library
        run: |
          cd native
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
          cd ..
          ls -la native/build/libvulkan_renderer.so
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp native/build/libvulkan_renderer.so app/src/main/jniLibs/arm64-v8a/
          mkdir -p mod/src/main/resources/lib/arm64-v8a
          cp native/build/libvulkan_renderer.so mod/src/main/resources/lib/arm64-v8a/

      - name: Build APK
        run: ./gradlew :app:assembleDebug

      - name: Build Mod JAR
        run: ./gradlew :mod:build

      - name: Verify mod JAR contains native library
        run: |
          JAR_PATH=$(ls mod/build/libs/*.jar | head -1)
          echo "Mod JAR: $JAR_PATH"
          ls -lh $JAR_PATH
          jar tf $JAR_PATH | grep libvulkan && echo "✅ Native library found in JAR"
          SIZE=$(stat -c%s "$JAR_PATH")
          if [ $SIZE -lt 100000 ]; then
            echo "❌ ERROR: JAR too small ($SIZE bytes)"
            exit 1
          else
            echo "✅ SUCCESS: JAR size is $SIZE bytes"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Mod JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-mod
          path: mod/build/libs/*.jar
