name: Build APK and Mod JAR

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.22.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build native Vulkan library
        run: |
          cd native
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
          cd ..
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp native/build/libvulkan_renderer.so app/src/main/jniLibs/arm64-v8a/
          ls -lh native/build/libvulkan_renderer.so

      - name: Verify native library size
        run: |
          SIZE=$(stat -c%s "native/build/libvulkan_renderer.so")
          # Accept size >= 500KB (previous threshold was too high)
          if [ $SIZE -lt 500000 ]; then
            echo "ERROR: Native library too small ($SIZE bytes) – likely stripped or corrupted"
            exit 1
          else
            echo "Native library size OK: $SIZE bytes"
          fi

      - name: Build APK
        run: ./gradlew :app:assembleDebug

      - name: Build Mod JAR
        run: ./gradlew :mod:build

      - name: Verify mod JAR contains native library
        run: |
          jar tf mod/build/libs/*.jar | grep libvulkan || echo "ERROR: Native library not found in JAR!"
          echo "Mod JAR size:"
          ls -lh mod/build/libs/*.jar

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Mod JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-mod
          path: mod/build/libs/*.jar
