name: Build APK and Mod JAR
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.22.1'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # Build Native Lib (can be shared from a single source)
      - name: Build native Vulkan library
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p mod/libs
          cd native
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cd ..
          cp native/build/libvulkan_renderer.so app/src/main/jniLibs/arm64-v8a/
          cp native/build/libvulkan_renderer.so mod/libs/
      # Build APK
      - name: Build APK
        run: ./gradlew :app:assembleDebug
      # Build Mod JAR with embedded .so
      - name: Build Mod JAR
        run: |
          ./gradlew :mod:build
          # Copy the .so into the JAR
          jar uf mod/build/libs/vulkanmod-${mod_version}.jar -C mod/libs libvulkan_renderer.so
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload Mod JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-mod
          path: mod/build/libs/*.jar
