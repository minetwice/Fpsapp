name: Build APK

on:
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.22.1'

      - name: Build Native Libraries for Multiple ABIs
        run: |
          # Define the ABIs you want to support
          ABIS=("armeabi-v7a" "arm64-v8a" "x86")

          for ABI in "${ABIS[@]}"; do
            echo "Building for ABI: $ABI"

            # Create a clean build directory for each ABI
            mkdir -p native/build/$ABI
            cd native/build/$ABI

            # Run CMake configuration for the specific ABI
            cmake ../.. \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-29 \
              -DCMAKE_BUILD_TYPE=Release

            # Build the library
            cmake --build . -j$(nproc)

            # Copy the resulting .so file to the correct jniLibs folder
            mkdir -p ../../../app/src/main/jniLibs/$ABI
            cp libvulkan_renderer.so ../../../app/src/main/jniLibs/$ABI/

            cd ../../..
          done

          # List the jniLibs directory to confirm all .so files are in place
          ls -la app/src/main/jniLibs/

      - name: Build APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Verify APK size
        run: ls -lh app/build/outputs/apk/debug/
