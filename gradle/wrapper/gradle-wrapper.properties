# This file specifies the Gradle distribution to use.
# The URL points to the official Gradle service.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

# 🔴 THIS IS THE MOST IMPORTANT LINE: It defines the exact Gradle version.
# Version 8.2 is compatible with Android Gradle Plugin 8.2.0 specified in the root build.gradle.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
