# Project-wide Gradle settings.

# Enable the build cache and parallel execution to speed up builds.
org.gradle.caching=true
org.gradle.parallel=true

# Configure the JVM's heap size for the Gradle daemon.
# This is a good default for most CI environments.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Use this flag to enable the new, more reliable configuration cache.
# It's an incubating feature, but great for speeding up CI builds.
# org.gradle.configuration-cache=true

# Android-specific settings for the build daemon.
android.useAndroidX=true
android.enableJetifier=true
